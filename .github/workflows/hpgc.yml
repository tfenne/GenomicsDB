# Builds and tests this fork's default branch on Linux x86-64 (GCC), Linux aarch64 (clang) and macOS arm64, loads the
# Linux libraries on several distributions, and assembles a jar carrying all three native libraries. A v* tag also
# uploads the jar to the Maven Central Portal as com.tfenne:genomicsdb, to be published there by hand.
name: hpgc

on:
  push:
    branches: [high_performance_germline_calling]
    tags: ['v*']
  pull_request:
    branches: [high_performance_germline_calling]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # A tag v1.6.0 releases 1.6.0; other builds are named after their commit
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=ci-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the toolchain image
        run: docker build -t hpgc-toolchain .github/hpgc

      # The dependencies built from source (protobuf, libdeflate, OpenSSL, libcurl, libuuid and TileDB's cloud SDKs)
      # take most of a clean build
      - uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.m2/repository
          key: ${{ matrix.platform }}-deps-${{ hashFiles('.github/hpgc/Dockerfile', 'CMakeLists.txt', 'cmake/Modules/BuildDistributableDependencies.cmake', 'dependencies/TileDB/CMakeLists.txt', 'dependencies/TileDB/cmake/Modules/*.cmake', 'dependencies/TileDB/cmake/patches/**') }}

      - name: Build and test
        run: |
          mkdir -p deps ~/.m2/repository
          docker run --rm -v "$PWD":/src -v "$HOME/.m2":/root/.m2 -w /src hpgc-toolchain \
            .github/hpgc/build.sh "$VERSION" /src/deps
          sudo chown -R "$(id -u):$(id -g)" . ~/.m2

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            build/target/genomicsdb-${{ env.VERSION }}.jar
            build/target/genomicsdb-${{ env.VERSION }}-allinone-spark.jar
            build/target/genomicsdb-${{ env.VERSION }}-sources.jar
            build/target/genomicsdb-${{ env.VERSION }}-javadoc.jar
            build/pom.xml
            build/src/main/libtiledbgenomicsdb.so

  macos:
    needs: version
    # The oldest macOS on Apple silicon that GitHub runs, and the minimum the library supports
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # htslib's build runs autoreconf
      - name: Install build tools
        run: brew install autoconf automake libtool

      - uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.m2/repository
          key: macos-aarch64-${{ env.MACOSX_DEPLOYMENT_TARGET }}-deps-${{ hashFiles('CMakeLists.txt', 'cmake/Modules/BuildDistributableDependencies.cmake', 'dependencies/TileDB/CMakeLists.txt', 'dependencies/TileDB/cmake/Modules/*.cmake', 'dependencies/TileDB/cmake/patches/**') }}

      - name: Build and test
        run: .github/hpgc/build.sh "$VERSION" "$PWD/deps"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: build/src/main/libtiledbgenomicsdb.dylib

  jar:
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4

      # Start from the x86-64 jars and add the aarch64 and macOS libraries under their platform directories
      - name: Assemble the multi-platform jars
        run: |
          mkdir -p out linux-aarch64-lib/linux-aarch64 macos-aarch64-lib/macos-aarch64
          cp linux-aarch64/src/main/libtiledbgenomicsdb.so linux-aarch64-lib/linux-aarch64/
          cp macos-aarch64/libtiledbgenomicsdb.dylib macos-aarch64-lib/macos-aarch64/
          for jar in "genomicsdb-$VERSION.jar" "genomicsdb-$VERSION-allinone-spark.jar"; do
            cp "linux-x86_64/target/$jar" "out/$jar"
            (cd linux-aarch64-lib && zip -q "../out/$jar" linux-aarch64/libtiledbgenomicsdb.so)
            (cd macos-aarch64-lib && zip -q "../out/$jar" macos-aarch64/libtiledbgenomicsdb.dylib)
            test "$(unzip -l "out/$jar" | grep -cE '(linux-x86_64|linux-aarch64|macos-aarch64)/libtiledbgenomicsdb')" = 3
          done
          cp "linux-x86_64/target/genomicsdb-$VERSION-sources.jar" "linux-x86_64/target/genomicsdb-$VERSION-javadoc.jar" out/
          cp linux-x86_64/pom.xml "out/genomicsdb-$VERSION.pom"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: genomicsdb-jars
          path: out/*

  distributions:
    needs: [version, jar]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: genomicsdb-jars
          path: out

      - name: Load the native library on each distribution
        run: |
          for image in amazonlinux:2023 ubuntu:24.04 debian:12 almalinux:9 almalinux:8; do
            docker run --rm -v "$PWD/out":/out:ro -v "$PWD/.github/hpgc":/hpgc:ro "$image" \
              /hpgc/smoke_test_on_distro.sh "/out/genomicsdb-$VERSION-allinone-spark.jar"
          done

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, jar, distributions]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: genomicsdb-jars
          path: out

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Bundle, sign and checksum
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: .github/hpgc/central_bundle.sh "$VERSION" out "genomicsdb-$VERSION-bundle.zip"

      # USER_MANAGED: the Portal validates the deployment and waits for it to be published by hand
      - name: Upload to the Maven Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          auth="Authorization: Bearer $(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          id=$(curl --fail-with-body -sS -H "$auth" -F "bundle=@genomicsdb-$VERSION-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=genomicsdb-$VERSION&publishingType=USER_MANAGED")
          echo "Deployment $id"
          for _ in $(seq 60); do
            status=$(curl --fail-with-body -sS -X POST -H "$auth" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id")
            state=$(echo "$status" | jq -r .deploymentState)
            echo "$state"
            case "$state" in
              VALIDATED) echo "Validated: publish it at https://central.sonatype.com/publishing/deployments"; exit 0 ;;
              FAILED) echo "$status" | jq .; exit 1 ;;
            esac
            sleep 10
          done
          echo "Still $state after 10 minutes; see https://central.sonatype.com/publishing/deployments" >&2
          exit 1
